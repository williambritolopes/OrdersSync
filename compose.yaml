
services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: ordersync-app

    working_dir: /var/www/html

    volumes:
      - ./:/var/www/html

    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ordersync
      DB_USERNAME: ordersync
      DB_PASSWORD: ordersync_secret

      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - ordersync-network

  nginx:
    image: nginx:1.27-alpine

    container_name: ordersync-nginx

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - ordersync-network

  mysql:
    image: mysql:8.0

    container_name: ordersync-mysql

    environment:
      MYSQL_DATABASE: ordersync
      MYSQL_USER: ordersync
      MYSQL_PASSWORD: ordersync_secret
      MYSQL_ROOT_PASSWORD: root_secret

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - ordersync-mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - ordersync-network

  redis:
    image: redis:7-alpine

    container_name: ordersync-redis

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - ordersync-network

networks:
  ordersync-network:
    driver: bridge

volumes:
  ordersync-mysql-data:
